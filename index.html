<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taylor Series Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Settings</h2>
            </div>
            
            <div class="controls-container">
                <div class="control-group">
                    <label for="function-select">Function</label>
                    <div class="select-wrapper">
                        <select id="function-select">
                            <optgroup label="1D Functions">
                                <option value="sin">sin(x)</option>
                                <option value="cos">cos(x)</option>
                                <option value="exp">e^x</option>
                                <option value="ln">ln(1+x)</option>
                                <option value="custom">Custom (1D)</option>
                            </optgroup>
                            <optgroup label="2D Surfaces">
                                <option value="sinxy">sin(x) + cos(y)</option>
                                <option value="expxy">e^{x·y}</option>
                                <option value="paraboloid">x² + y²</option>
                                <option value="saddle">x · y</option>
                                <option value="custom2d">Custom (2D)</option>
                            </optgroup>
                            <optgroup label="3D Volumetric">
                                <option value="sinxyz">sin(x) + cos(y) + sin(z)</option>
                                <option value="exp3d">e^{(x+y+z)/3}</option>
                                <option value="sphere">x² + y² + z²</option>
                                <option value="mixprod">xy + yz + zx</option>
                                <option value="custom3d">Custom (3D)</option>
                            </optgroup>
                        </select>
                        <svg class="select-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                </div>
                
                <div class="control-group" id="custom-function-group" style="display: none;">
                    <label for="custom-function">Expression</label>
                    <input type="text" id="custom-function" placeholder="e.g. x^2 + 2*x" autocomplete="off">
                    <span class="error-message" id="custom-error">Invalid syntax</span>
                </div>
                
                <div class="divider"></div>

                <div class="control-group">
                    <div class="label-row">
                        <label for="terms-slider">Approximation Order (N)</label>
                        <span class="value-badge" id="terms-value">1</span>
                    </div>
                    <div class="slider-container">
                        <input type="range" id="terms-slider" min="1" max="100" value="1" step="1">
                        <div class="slider-track-fill" style="width: 0%"></div>
                    </div>
                </div>
                
                <div class="control-group">
                    <div class="label-row">
                        <label for="center-slider">Expansion Point X</label>
                        <span class="value-badge" id="center-value">0.0</span>
                    </div>
                    <div class="slider-container">
                        <input type="range" id="center-slider" min="-5" max="5" value="0" step="0.1">
                        <div class="slider-track-fill" style="width: 50%"></div>
                    </div>
                </div>

                <div class="control-group" id="center-y-group" style="display: none;">
                    <div class="label-row">
                        <label for="center-slider-y">Expansion Point Y</label>
                        <span class="value-badge" id="center-value-y">0.0</span>
                    </div>
                    <div class="slider-container">
                        <input type="range" id="center-slider-y" min="-5" max="5" value="0" step="0.1">
                        <div class="slider-track-fill" style="width: 50%"></div>
                    </div>
                </div>

                <div class="control-group" id="center-z-group" style="display: none;">
                    <div class="label-row">
                        <label for="center-slider-z">Expansion Point Z</label>
                        <span class="value-badge" id="center-value-z">0.0</span>
                    </div>
                    <div class="slider-container">
                        <input type="range" id="center-slider-z" min="-5" max="5" value="0" step="0.1">
                        <div class="slider-track-fill" style="width: 50%"></div>
                    </div>
                </div>

                <div class="control-group info-box" id="multi-hint" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    <p id="multi-hint-text">For 2D, visualizing slice at y = a_y.</p>
                </div>
                
                <div class="actions">
                    <button id="play-button" class="btn primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Animate
                    </button>
                    <button id="reset-button" class="btn secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"></path></svg>
                        Reset
                    </button>
                </div>
            </div>
            
            <div class="sidebar-footer">
                <p>Taylor Series Visualizer</p>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h1>Taylor Approximation</h1>
            </header>
            
            <div class="canvas-wrapper">
                <canvas id="graph-canvas"></canvas>
                <div class="overlay-formula">
                    <span class="formula-label">Approximation:</span>
                    <div id="formula-display"></div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
